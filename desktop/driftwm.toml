autostart = ["swaync --style /etc/swaync/acer.css", "waybar -c /etc/waybar/acer.json -s /etc/waybar/acer.css"]

[input.keyboard]
layout = "es"

[decorations]
border_width = 2
border_color = "#443d48"
border_color_focused = "#eac4a7"

[snap]
outer_gap = 16.0

[keybindings]
"mod+d" = "exec fuzzel --config=/etc/fuzzel/acer.ini"
"mod+return" = "exec foot -c /etc/foot/acer.ini"
"mod+l" = "spawn swaylock -f -c 211d25 -kl"
"mod+shift+n" = "spawn swaync-client -t"
"XF86AudioRaiseVolume" = "spawn pactl set-sink-volume @DEFAULT_SINK@ +5%"
"XF86AudioLowerVolume" = "spawn pactl set-sink-volume @DEFAULT_SINK@ -5%"
"XF86AudioMute" = "spawn pactl set-sink-mute @DEFAULT_SINK@ toggle"
"shift+Print" = 'spawn region=$(slurp -d) && grim -g "$region" - | wl-copy --type image/png'
